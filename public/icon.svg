<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <g filter="url(#shadow)">
    <!-- Book/Ledger/Wallet icon -->
    <rect x="116" y="116" width="280" height="280" rx="36" fill="#ffffff" />
    <path d="M156 166 H356" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
    <path d="M156 226 H276" stroke="#14b8a6" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Indian Rupee symbol in vibrant green -->
    <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#0f766e" text-anchor="middle">₹</text>
  </g>
</svg>
